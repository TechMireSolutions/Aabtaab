name: Deploy to production

# Runs after CI succeeds on main, or manually from Actions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit SHA to deploy
        required: false
        default: main
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  APP_DIR: /var/www/aabtaab_next
  SITE_URL: https://aabtaab.com

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://aabtaab.com

    # workflow_run: only this repo, main branch, successful CI push.
    # workflow_dispatch: manual deploy (optional ref input resolved on server).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.repository.full_name == github.repository
      )

    steps:
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ github.event.inputs.ref }}"
            [ -z "$ref" ] && ref="main"
            echo "mode=ref" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "Deploying ref: $ref (manual)"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "mode=sha" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Deploying SHA: $sha (post-CI)"
          fi

      - name: Verify deploy secrets and SSH key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          missing=""
          [ -z "$SERVER_HOST" ] && missing="$missing SERVER_HOST"
          [ -z "$SERVER_USER" ] && missing="$missing SERVER_USER"
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            missing="$missing SSH_PRIVATE_KEY_B64 (or SSH_PRIVATE_KEY)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "Add them at: Repository → Settings → Secrets and variables → Actions"
            exit 1
          fi
          if echo "$SERVER_HOST" | grep -qE '[[:space:]/]|^https?://'; then
            echo "::error::SERVER_HOST must be an IP or hostname only (no https://, no spaces)"
            exit 1
          fi

          umask 077
          mkdir -p ~/.ssh

          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            echo "Using SSH_PRIVATE_KEY_B64"
            echo "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_PRIVATE_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "Using SSH_PRIVATE_KEY (PEM)"
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          elif echo "$SSH_PRIVATE_KEY" | tr -d '[:space:]' | base64 -d 2>/dev/null | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "Using SSH_PRIVATE_KEY (base64-encoded PEM)"
            echo "$SSH_PRIVATE_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          else
            echo "::error::SSH key secret is invalid."
            if echo "$SSH_PRIVATE_KEY" | grep -qE '^(ssh-rsa|ssh-ed25519|ecdsa-sha2)'; then
              echo "You pasted a PUBLIC key into SSH_PRIVATE_KEY."
            fi
            echo ""
            echo "Recommended — add secret SSH_PRIVATE_KEY_B64 (single line, no newlines):"
            echo "  base64 -i ~/.ssh/aabtaab_deploy | tr -d '\\n' | pbcopy"
            exit 1
          fi

          chmod 600 ~/.ssh/deploy_key

          if ! grep -q 'BEGIN.*PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "::error::Decoded key is not a PEM private key."
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH private key failed validation (passphrase-protected keys are not supported)."
            exit 1
          fi
          echo "DEPLOY_KEY_PATH=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"
          echo "SSH key format OK"

      - name: Trust server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ env.APP_DIR }}
          DEPLOY_MODE: ${{ steps.target.outputs.mode }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_REF: ${{ steps.target.outputs.ref }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ${{ env.DEPLOY_KEY_PATH }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: APP_DIR,DEPLOY_MODE,DEPLOY_SHA,DEPLOY_REF
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            if [ "$DEPLOY_MODE" = "sha" ]; then
              export DEPLOY_SHA
            elif echo "$DEPLOY_REF" | grep -qE '^[0-9a-f]{7,40}$'; then
              export DEPLOY_SHA="$DEPLOY_REF"
            else
              export DEPLOY_SHA="origin/${DEPLOY_REF}"
            fi

            chmod +x scripts/deploy-remote.sh
            ./scripts/deploy-remote.sh

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_MODE: ${{ steps.target.outputs.mode }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_REF: ${{ steps.target.outputs.ref }}
        run: |
          {
            echo "## Production deploy"
            echo ""
            if [ "$DEPLOY_MODE" = "sha" ]; then
              echo "- **Trigger:** CI passed on \`main\`"
              echo "- **Commit:** [\`${DEPLOY_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${DEPLOY_SHA})"
            else
              echo "- **Trigger:** Manual (\`workflow_dispatch\`)"
              echo "- **Ref:** \`${DEPLOY_REF}\`"
            fi
            echo "- **Site:** ${{ env.SITE_URL }}"
            echo "- **Job status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
