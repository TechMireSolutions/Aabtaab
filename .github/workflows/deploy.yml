name: Deploy Aabtaab Website

on:
  push:
    branches:
      - main # Agar developer ki main branch ka naam 'master' hai, toh woh yahan master likh dega

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/aabtaab_next
            git pull origin main
            npm install
            npm run build
            pm2 restart aabtaab-next
